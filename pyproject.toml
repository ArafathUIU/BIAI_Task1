[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplier-doc-check"
version = "0.1.0"
description = "Task 1: supplier document checker (fixed-step LangGraph pipeline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "pypdf>=4.3",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supplier_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
