[browser]
gatherUsageStats = false

[server]
headless = true
# Do not hardcode port — local CLI uses --server.port 8510;
# Render injects $PORT and the start command binds to it.
enableCORS = false
enableXsrfProtection = true

[theme]
primaryColor = "#0F6B7F"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12263A"
font = "sans serif"

[client]
toolbarMode = "minimal"
